<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/styles.css?v=1.0.1">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <script src="/assets/js/scripts.js"></script>
    <script 
        type="text/javascript" 
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
        (function() {
            emailjs.init({
                publicKey: "78oDtYz0qO6YMbbLz"
            });
        })();
    </script>
    <script type="text/javascript">
        window.onload = function() {
            document.getElementById('contact_form').addEventListener('submit', function(event) {
                event.preventDefault();
                emailjs.sendForm('contact_service', 'contact_form', this)
                .then(() => {
                    console.log('SUCCESS!');
                }, (error) => {
                    console.log('FAILED...', error);
                });
            });
        }
    </script>
    <title>Nicholas Much</title>
</head>
<body>

    <nav class="navigation">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/projects/">Projects</a></li>
            <li><a href="/services/">Services</a></li>
            <li><a href="/contact/">Contact</a></li>
        </ul>
    </nav>

    <section class="contact-top">
        <h1 id="contact-title">Need something made?</h1>
        <p id="contact-title-description">Fill out the form below to get in contact with me.</p>
    </section>

    <form class="contact-form" id="contact_form">

        <div>
            <label for="fname">First Name: *</label><br>
            <input type="text" id="fname" name="fname" required>
        </div>
        <div>
            <label for="email">Email: *</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="business-name">Business Name:</label><br>
            <input type="text" id="business-name" name="business-name">
        </div>
        <div>
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone">
        </div>
        <div>
            <label for="message">Message / Inquiry:</label><br>
            <input type="text" id="message" name="message">
        </div>
        <div class="message">
            <label>*= required</label><br>
        </div>
    </form>

    <div class="bottom">
        <input type="submit" form="contact_form" value="Send" id="send">
    </div>

    <footer>
        <div class="footer-left">
            <p>&copy; 2026 Nicholas Much. All rights reserved.</p>
        </div>
        <div class="footer-center">
            <a href="https://github.com/FrozenTundraStudio" class="social" id="github" width="1" height="1"></a>
            <a href="https://www.linkedin.com/in/nicholas-much/" class="social" id="linkedin" width="1" height="1"></a>
        </div>
        <div class="footer-right">
            <p>nickmuch23@gmail.com</p>
        </div>
    </footer>
</body>
</html>
