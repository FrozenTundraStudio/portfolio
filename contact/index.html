    <nav class="navigation">

    <section class="contact-top">
        <h1 id="contact-title">Need something made?</h1>
        <p id="contact-title-description">Fill out the form below to get in contact with me.</p>
    </section>

    <form class="contact-form">

        <div class="contact-column">
            <div class="contact-row">
                <label for="fname">First Name:</label><br>
                <input type="text" id="fname" name="fname">
            </div>
            <div class="contact-row">
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </div>
        </div>
        
        <div class="contact-column">
            <div class="contact-row">
                <label for="business-name">Business Name:</label><br>
                <input type="text" id="business-name" name="business-name">
            </div>
            <div class="contact-row">
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required>
            </div>
        </div>
    </form>
